[project]
name = "clustering"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3.2",
    "npy-append-array>=0.9.16",
    "scikit-learn>=1.4.0",
    "soundfile>=0.13.1",
    "submitit>=1.5.3",
    "torchaudio>=2.5.1",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
torchaudio = { index = "pytorch-cu124" }
vsp-llm = { workspace = true }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
