[project]
name = "vsp-llm"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bitsandbytes==0.48.1",
    "cython==3.0.8",
    "datasets==2.17.0",
    "editdistance==0.6.0",
    "einops==0.7.0",
    "fairseq>=0.12.2",
    "hydra-core==1.0.7",
    "importlib-metadata==7.0.1",
    "joblib==1.3.2",
    "librosa==0.10.1",
    "multidict==6.0.5",
    "multiprocess==0.70.16",
    "npy-append-array==0.9.16",
    "numba==0.59.0",
    "numpy>=1.26.4",
    "oauthlib==3.2.2",
    "omegaconf==2.0.6",
    "opencv-python==4.5.4.60",
    "packaging==23.2",
    "pandas==2.2.0",
    "peft>=0.17.1",
    "psutil==5.9.8",
    "python-dateutil==2.8.2",
    "python-speech-features==0.6",
    "sacrebleu==2.4.0",
    "safetensors==0.4.2",
    "scikit-learn==1.4.0",
    "scipy==1.10.0",
    "sentencepiece==0.1.96",
    "torch>=2.5.1",
    "torchaudio>=2.5.1",
    "tqdm>=4.67.1",
    "transformers>=4.49.0",
    "typing-extensions==4.9.0",
]

[tool.uv.sources]
fairseq = { path = "./fairseq", editable = true }
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["clustering"]

[tool.mypy]
check_untyped_defs = true
