[project]
name = "clustering"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3.2",
    "npy-append-array>=0.9.16",
    "scikit-learn>=1.4.0",
    "soundfile>=0.13.1",
    "submitit>=1.5.3",
    "torchaudio>=2.5.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = ["README.md", "requirements.txt"]

[tool.hatch.build.sources]
"." = "clustering"

[tool.uv.sources]
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
